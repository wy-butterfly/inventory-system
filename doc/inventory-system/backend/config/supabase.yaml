# Supabase 配置
database:
  host: "${SUPABASE_HOST}"
  port: 5432
  user: "${SUPABASE_USER}"
  password: "${SUPABASE_PASSWORD}"
  dbname: "${SUPABASE_DB_NAME}"
  sslmode: "require"
  timezone: "Asia/Shanghai"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

# JWT 配置 (使用 Supabase JWT)
jwt:
  secret: "${SUPABASE_JWT_SECRET}"
  expire_hours: 24

# 阿里云 OSS 配置
oss:
  endpoint: "${OSS_ENDPOINT}"
  access_key_id: "${OSS_ACCESS_KEY_ID}"
  access_key_secret: "${OSS_ACCESS_KEY_SECRET}"
  bucket_name: "${OSS_BUCKET_NAME}"
  bucket_domain: "${OSS_BUCKET_DOMAIN}"

# 服务配置
server:
  port: "${PORT:-8080}"
  mode: "release"

# 日志配置
log:
  level: "info"
  format: "json"
